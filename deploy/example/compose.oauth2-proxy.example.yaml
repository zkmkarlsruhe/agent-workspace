# Apply with -f compose.yaml -f compose.oauth2-proxy.example.yaml.
# Keep the base .env; Authentik credentials are unused with this overlay.
services:
  manager:
    environment:
      OC_IDENTITY_ISSUER: ${OC_IDENTITY_ISSUER:?choose a persistent namespace for this NEW installation}
      OC_IDENTITY_SUBJECT_HEADER: X-Auth-Request-User
      OC_IDENTITY_HEADER_UID: "-"
      OC_IDENTITY_HEADER_USERNAME: X-Auth-Request-Preferred-Username
      OC_IDENTITY_HEADER_EMAIL: X-Auth-Request-Email
      # Stock set-xauthrequest does not emit a display name; the profile name stays empty.
      OC_IDENTITY_HEADER_NAME: X-Auth-Request-Name
      OC_IDENTITY_HEADER_GROUPS: X-Auth-Request-Groups
      OC_IDENTITY_GROUPS_SEPARATOR: ","
      OC_LOGOUT_URL: ${OC_LOGOUT_URL:-/oauth2/sign_out}
      OC_REQUIRED_GROUP: ${OC_REQUIRED_GROUP:-workspace-users}
      OC_ADMIN_GROUP: ${OC_ADMIN_GROUP:-workspace-admins}
  traefik:
    volumes:
      - ./traefik.oauth2-proxy.yaml:/etc/traefik/dynamic.yaml:ro
  postgres:
    profiles: [authentik]
  authentik:
    profiles: [authentik]
  authentik-worker:
    profiles: [authentik]
  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:?set a reviewed oauth2-proxy v7 image digest}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    command:
      - --provider=oidc
      - --http-address=0.0.0.0:4180
      - --upstream=static://202
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --scope=openid email profile groups
      - --oidc-groups-claim=groups
      - --code-challenge-method=S256
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-refresh=0
    environment:
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set the OIDC discovery issuer}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?generate 32 random bytes, base64 encoded}
      OAUTH2_PROXY_REDIRECT_URL: https://${OC_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${OC_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${OC_DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OIDC_EMAIL_DOMAINS:?set allowed email domains}
    networks:
      edge: {ipv4_address: 172.30.0.5}
