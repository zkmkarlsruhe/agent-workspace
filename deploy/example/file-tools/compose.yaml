services:
  manager:
    environment:
      OC_FILE_TOOLS_SECRET: ${OC_FILE_TOOLS_SECRET:?set a random shared file-tools secret}
      OC_FILE_TOOLS_URL: http://file-tools:8080
      OC_HANDWRITING_MODEL: ${OC_HANDWRITING_MODEL:--}
    networks:
      file-tools: {}
  file-tools:
    image: workspace-file-tools:local
    build:
      context: ../../services/file-tools
    environment:
      OC_FILE_TOOLS_SECRET: ${OC_FILE_TOOLS_SECRET:?set a random shared file-tools secret}
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 12g
    cpus: 2
    pids_limit: 128
    tmpfs: ["/tmp:size=256m,mode=1777"]
    networks:
      file-tools: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
networks:
  file-tools:
    internal: true
