    de: "Preise sind vom Betreiber konfigurierte Schätzwerte. Kostenwährung des Modelldienstes: [[accounting.upstream_cost_currency]] (none bedeutet, dass gemeldete Kosten nicht verwendet werden). Umrechnungskurs: [[accounting.usd_per_eur]] USD pro EUR (0 bedeutet, dass kein Kurs konfiguriert ist). Tokenschätzpreise in EUR pro Million, Eingabe/Ausgabe: [[accounting.prices]]."
